name: DAST con OWASP ZAP y Docker Local

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  owasp-zap-scan:
    name: Escaneo DAST local
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Levantar OWASP Juice Shop localmente con Docker
        run: |
          docker run -d -p 3000:3000 bkimminich/juice-shop
          # Esperar unos segundos a que la aplicación inicie correctamente
          echo "Esperando a que la aplicación esté lista..."
          until curl -s http://localhost:3000 > /dev/null; do
            sleep 5
          done

      - name: Ejecutar OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:3000/'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
        continue-on-error: true

      - name: Subir reporte de ZAP como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: zap-scan-report
          path: |
            report.html
            report.md
